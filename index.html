<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  --bg:#eef2f7;
  --surface:#ffffff;
  --surface2:#dde4ee;
  --gold:#d35400;
  --gold-dim:#a04000;
  --green:#27ae60;
  --green-dark:#1e8449;
  --red:#e74c3c;
  --red-dark:#c0392b;
  --text:#1a2535;
  --muted:#607080;
  --border:#c8d4e0;
  --ocean:#aad4e8;
}

html,body{height:100%;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:12px 10px 20px;
  overflow-x:hidden;
}

/* ── HEADER ── */
header{text-align:center;margin-bottom:10px;}
header h1{
  font-family:'Syne',sans-serif;
  font-size:clamp(20px,5vw,34px);
  font-weight:800;
  color:var(--gold);
  letter-spacing:3px;
  text-transform:uppercase;
  line-height:1;
}
header p{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:1.5px;text-transform:uppercase;}

/* ── HUD ── */
.hud{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  width:100%;
  max-width:600px;
  margin-bottom:10px;
}
.stat{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:7px 4px;
  text-align:center;
}
.stat-val{
  font-family:'Syne',sans-serif;
  font-size:clamp(18px,4vw,26px);
  font-weight:800;
  line-height:1;
}
.stat-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}

/* ── QUESTION BOX ── */
#question-box{
  background:var(--surface);
  border:1.5px solid var(--gold-dim);
  border-radius:14px;
  padding:8px 16px 10px;
  text-align:center;
  width:100%;
  max-width:600px;
  margin-bottom:8px;
}
.eyebrow{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:2px;}
#country-name{
  font-family:'Syne',sans-serif;
  font-size:clamp(18px,4vw,28px);
  font-weight:800;
  color:var(--gold);
  letter-spacing:0.5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* ── MAP ── */
#map-wrap{
  width:100%;
  max-width:600px;
  position:relative;
  background:var(--ocean);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  flex-shrink:0;
}
#map-wrap svg{display:block;width:100%;height:auto;cursor:crosshair;touch-action:none;}

/* Ocean background */
.ocean-bg{fill:var(--ocean);}

/* Country default fills — 8 vivid colors assigned per country */
.country{
  stroke:#ffffff;
  stroke-width:1;
  transition:fill 0.13s, filter 0.13s;
  cursor:pointer;
}
.country:hover{filter:brightness(1.18);stroke:#fff;stroke-width:1.5;}

/* State overrides */
.country.correct{fill:#16a34a !important;stroke:#4ade80;stroke-width:1.5;filter:none;}
.country.wrong-flash{fill:#dc2626 !important;stroke:#f87171;stroke-width:1.5;filter:none;}
.country.done{opacity:0.4;cursor:default;filter:none;}
.country.done:hover{filter:none;stroke:#fff;stroke-width:1;}

/* ── TOOLTIP ── */
#tooltip{
  position:absolute;
  background:#1a2535ee;
  border:1px solid var(--border);
  border-radius:8px;
  padding:4px 11px;
  font-size:12px;
  color:#fff;
  pointer-events:none;
  display:none;
  white-space:nowrap;
  z-index:30;
}

/* ── FEEDBACK ── */
#feedback{
  text-align:center;
  min-height:24px;
  font-size:clamp(13px,3vw,15px);
  font-weight:500;
  margin-top:6px;
  letter-spacing:0.3px;
  width:100%;
  max-width:600px;
}
.fb-correct{color:var(--green);}
.fb-wrong{color:var(--red);}

/* ── PROGRESS ── */
#progress-bar{
  width:100%;
  max-width:600px;
  height:5px;
  background:var(--surface2);
  border-radius:3px;
  margin-top:8px;
  overflow:hidden;
}
#progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--gold),#f08040);
  border-radius:3px;
  transition:width 0.5s ease;
  width:0%;
}

/* ── END SCREEN ── */
#end-screen{
  display:none;
  flex-direction:column;
  align-items:center;
  gap:12px;
  padding:20px;
  text-align:center;
  width:100%;
  max-width:600px;
}
#end-screen h2{
  font-family:'Syne',sans-serif;
  font-size:clamp(26px,6vw,38px);
  font-weight:800;
  color:var(--gold);
}
#end-screen p{color:var(--muted);font-size:15px;}
#restart-btn{
  background:var(--gold);
  color:#0a1520;
  border:none;
  border-radius:10px;
  padding:12px 36px;
  font-family:'Syne',sans-serif;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  letter-spacing:1px;
  transition:background 0.15s,transform 0.1s;
}
#restart-btn:hover{background:#f8d860;transform:scale(1.04);}

#loading{
  color:var(--muted);
  font-size:13px;
  padding:40px;
  text-align:center;
}

/* ── DESKTOP: side-by-side layout ── */
@media(min-width:700px){
  body{padding:16px 20px 24px;}
  .layout{
    display:grid;
    grid-template-columns:1fr 300px;
    gap:14px;
    width:100%;
    max-width:960px;
    align-items:start;
  }
  .left-col{display:flex;flex-direction:column;gap:8px;}
  .right-col{display:flex;flex-direction:column;gap:8px;position:sticky;top:16px;}
  #map-wrap{max-width:none;}
  .hud{max-width:none;grid-template-columns:repeat(4,1fr);}
  #question-box{max-width:none;}
  #feedback{max-width:none;}
  #progress-bar{max-width:none;}
  #end-screen{max-width:none;}

  /* Desktop legend */
  #legend{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
    display:block;
  }
  #legend h3{
    font-family:'Syne',sans-serif;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:2px;
    color:var(--muted);
    margin-bottom:10px;
  }
  .legend-item{
    display:flex;align-items:center;gap:8px;
    font-size:12px;color:var(--text);
    margin-bottom:6px;
  }
  .legend-swatch{width:14px;height:14px;border-radius:3px;flex-shrink:0;}
}
@media(max-width:699px){
  #legend{display:none;}
  .layout{display:contents;}
}
</style>
</head>
<body>

<header>
  <p>Tap the correct country on the map</p>
</header>

<div class="layout">
  <div class="left-col">
    <div class="hud">
      <div class="stat"><div class="stat-val" id="s-correct" style="color:var(--green)">0</div><div class="stat-label">Correct</div></div>
      <div class="stat"><div class="stat-val" id="s-wrong" style="color:var(--red)">0</div><div class="stat-label">Wrong</div></div>
      <div class="stat"><div class="stat-val" id="s-score" style="color:var(--gold)">0</div><div class="stat-label">Score</div></div>
      <div class="stat"><div class="stat-val" id="s-left" style="color:#8baac5">—</div><div class="stat-label">Left</div></div>
    </div>

    <div id="question-box">
      <div class="eyebrow">Find this country</div>
      <div id="country-name">Loading…</div>
    </div>

    <div id="map-wrap">
      <div id="tooltip"></div>
      <div id="loading">Loading geographic data…</div>
    </div>

    <div id="feedback"></div>
    <div id="progress-bar"><div id="progress-fill"></div></div>

    <div id="end-screen">
      <h2>Quiz Complete! 🎉</h2>
      <p id="final-text"></p>
      <button id="restart-btn" onclick="startGame()">Play Again</button>
    </div>
  </div>

  <div class="right-col">
    <div id="legend">
      <h3>Map Legend</h3>
      <div class="legend-item"><div class="legend-swatch" style="background:#e8543a"></div>Color 1</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#f2a829"></div>Color 2</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#6aaa3a"></div>Color 3</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#3a8bc8"></div>Color 4</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#9b59b6"></div>Color 5</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#2ab8a0"></div>Color 6</div>
      <div class="legend-item" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">
        <div class="legend-swatch" style="background:#27ae60"></div>Correct ✓
      </div>
      <div class="legend-item"><div class="legend-swatch" style="background:#e74c3c"></div>Wrong ✗</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#bcd8b0;opacity:0.8"></div>Already found</div>
    </div>
  </div>
</div>

<script>
/* ── ISO sets & names ── */
const AFRICAN_ISO = new Set([
  "DZA","AGO","BEN","BWA","BFA","BDI","CMR","CPV","CAF","TCD",
  "COM","COD","COG","CIV","DJI","EGY","GNQ","ERI","SWZ","ETH",
  "GAB","GMB","GHA","GIN","GNB","KEN","LSO","LBR","LBY","MDG",
  "MWI","MLI","MRT","MUS","MAR","MOZ","NAM","NER","NGA","RWA",
  "STP","SEN","SYC","SLE","SOM","ZAF","SSD","SDN","TZA","TGO",
  "TUN","UGA","ESH","ZMB","ZWE"
]);

const COUNTRY_NAMES = {
  "DZA":"Algeria","AGO":"Angola","BEN":"Benin","BWA":"Botswana","BFA":"Burkina Faso",
  "BDI":"Burundi","CMR":"Cameroon","CPV":"Cape Verde","CAF":"Central African Republic",
  "TCD":"Chad","COM":"Comoros","COD":"DR Congo","COG":"Rep. of the Congo",
  "CIV":"Ivory Coast","DJI":"Djibouti","EGY":"Egypt","GNQ":"Equatorial Guinea",
  "ERI":"Eritrea","SWZ":"Eswatini","ETH":"Ethiopia","GAB":"Gabon","GMB":"The Gambia",
  "GHA":"Ghana","GIN":"Guinea","GNB":"Guinea-Bissau","KEN":"Kenya","LSO":"Lesotho",
  "LBR":"Liberia","LBY":"Libya","MDG":"Madagascar","MWI":"Malawi","MLI":"Mali",
  "MRT":"Mauritania","MUS":"Mauritius","MAR":"Morocco","MOZ":"Mozambique","NAM":"Namibia",
  "NER":"Niger","NGA":"Nigeria","RWA":"Rwanda","STP":"São Tomé & Príncipe",
  "SEN":"Senegal","SYC":"Seychelles","SLE":"Sierra Leone","SOM":"Somalia",
  "ZAF":"South Africa","SSD":"South Sudan","SDN":"Sudan","TZA":"Tanzania",
  "TGO":"Togo","TUN":"Tunisia","UGA":"Uganda","ESH":"Western Sahara",
  "ZMB":"Zambia","ZWE":"Zimbabwe"
};

/* ── Seterra-style flat palette — 6 vivid colors, graph-colored so neighbours differ ── */
const SC = ["#e8543a","#f2a829","#6aaa3a","#3a8bc8","#9b59b6","#2ab8a0"];
const REGION_COLOR = {
  "MAR":0,"DZA":1,"TUN":2,"LBY":3,"EGY":0,"ESH":2,
  "MRT":0,"MLI":2,"NER":0,"TCD":1,"SDN":2,"ERI":0,
  "SEN":1,"GMB":3,"GNB":2,"GIN":3,"SLE":0,"LBR":1,
  "CIV":2,"GHA":0,"BFA":1,"TGO":3,"BEN":2,"NGA":3,
  "CMR":0,"CAF":2,"SSD":0,"ETH":1,"DJI":3,"SOM":2,
  "GNQ":1,"GAB":3,"COG":1,"COD":3,"UGA":3,"KEN":2,
  "RWA":0,"BDI":1,"TZA":0,"AGO":1,"ZMB":2,"MWI":1,
  "MOZ":3,"ZWE":0,"BWA":2,"NAM":0,"ZAF":1,"LSO":3,"SWZ":2,
  "MDG":4,"STP":4,"CPV":5,"COM":5,"MUS":4,"SYC":5,
};
function getCountryColor(iso){
  const idx=REGION_COLOR[iso];
  return idx!==undefined ? SC[idx] : SC[0];
}

const NUM_TO_ISO = {
  "012":"DZA","024":"AGO","204":"BEN","072":"BWA","854":"BFA","108":"BDI",
  "120":"CMR","132":"CPV","140":"CAF","148":"TCD","174":"COM","180":"COD",
  "178":"COG","384":"CIV","262":"DJI","818":"EGY","226":"GNQ","232":"ERI",
  "748":"SWZ","231":"ETH","266":"GAB","270":"GMB","288":"GHA","324":"GIN",
  "624":"GNB","404":"KEN","426":"LSO","430":"LBR","434":"LBY","450":"MDG",
  "454":"MWI","466":"MLI","478":"MRT","480":"MUS","504":"MAR","508":"MOZ",
  "516":"NAM","562":"NER","566":"NGA","646":"RWA","678":"STP","686":"SEN",
  "690":"SYC","694":"SLE","706":"SOM","710":"ZAF","728":"SSD","729":"SDN",
  "834":"TZA","768":"TGO","788":"TUN","800":"UGA","732":"ESH","894":"ZMB","716":"ZWE"
};
function numericToISO(id){ return NUM_TO_ISO[String(id).padStart(3,'0')]; }

/* ── Game state ── */
let geojson=null, queue=[], correct=0, wrong=0, score=0, left=0;
let current=null, guessing=false;
let projection, pathGen, svgEl, gEl;

/* ── Load & draw ── */
async function loadMap(){
  const url="https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json";
  const topo=await fetch(url).then(r=>r.json());
  const {feature}=await import("https://cdn.jsdelivr.net/npm/topojson-client@3/+esm");
  const world=feature(topo,topo.objects.countries);
  geojson={
    type:"FeatureCollection",
    features:world.features.filter(f=>{
      const iso=numericToISO(f.id);
      return iso && AFRICAN_ISO.has(iso);
    })
  };
  document.getElementById('loading').remove();
  drawMap();
  startGame();  // called once after map is built
}

let mapReady = false;

function drawMap(){
  const wrap=document.getElementById('map-wrap');
  const W=600, H=680;

  projection=d3.geoMercator().fitSize([W,H],geojson).clipExtent([[0,0],[W,H]]);
  pathGen=d3.geoPath().projection(projection);

  svgEl=d3.select('#map-wrap').append('svg')
    .attr('viewBox',`0 0 ${W} ${H}`)
    .attr('width',W).attr('height',H);

  /* ocean */
  svgEl.append('rect').attr('width',W).attr('height',H).attr('class','ocean-bg');

  gEl=svgEl.append('g');

  /* country paths */
  gEl.selectAll('.country')
    .data(geojson.features)
    .enter().append('path')
    .attr('class','country')
    .attr('d',pathGen)
    .attr('data-iso',d=>numericToISO(d.id))
    .style('fill',d=>getCountryColor(numericToISO(d.id)))
    .on('click',function(event,d){
      onClick(numericToISO(d.id));
    })
    .on('mousemove',function(event,d){
      const iso=numericToISO(d.id);
      const name=COUNTRY_NAMES[iso]||iso;
      const [mx,my]=d3.pointer(event,wrap);
      const tt=document.getElementById('tooltip');
      tt.textContent=name;
      tt.style.display='block';
      const tw=tt.offsetWidth||120;
      const ww=wrap.offsetWidth;
      tt.style.left=Math.min(mx+14,ww-tw-8)+'px';
      tt.style.top=Math.max(my-34,4)+'px';
    })
    .on('touchstart',function(event,d){
      event.preventDefault();
      onClick(numericToISO(d.id));
    },{passive:false})
    .on('mouseleave',function(){
      document.getElementById('tooltip').style.display='none';
    });

  mapReady = true;
}

/* ── Game logic ── */
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function startGame(){
  correct=0;wrong=0;score=0;
  queue=shuffle(Object.keys(COUNTRY_NAMES));
  left=queue.length;
  current=null;guessing=false;
  document.getElementById('end-screen').style.display='none';
  document.getElementById('question-box').style.display='block';
  document.getElementById('progress-bar').style.display='block';
  document.getElementById('feedback').textContent='';
  document.getElementById('progress-fill').style.width='0%';
  // reset map colors without touching the DOM structure
  if(mapReady && gEl){
    gEl.selectAll('.country')
      .classed('correct',false)
      .classed('done',false)
      .classed('wrong-flash',false)
      .style('fill',d=>getCountryColor(numericToISO(d.id)))
      .style('opacity',null);
  }
  updateHUD();
  nextQuestion();
}

function nextQuestion(){
  if(queue.length===0){endGame();return;}
  current=queue.shift();
  left--;
  guessing=true;
  document.getElementById('country-name').textContent=COUNTRY_NAMES[current]||current;
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='';
  updateHUD();
  updateProgress();
}

function updateHUD(){
  document.getElementById('s-correct').textContent=correct;
  document.getElementById('s-wrong').textContent=wrong;
  document.getElementById('s-score').textContent=score;
  document.getElementById('s-left').textContent=left;
}

function updateProgress(){
  const total=Object.keys(COUNTRY_NAMES).length;
  const done=total-left;
  document.getElementById('progress-fill').style.width=Math.round((done/total)*100)+'%';
}

function getPath(iso){
  return gEl?gEl.selectAll('.country').filter(d=>numericToISO(d.id)===iso):null;
}

function onClick(iso){
  if(!guessing||!current) return;
  if(!AFRICAN_ISO.has(iso)) return;
  const fb=document.getElementById('feedback');

  if(iso===current){
    correct++;score+=10;guessing=false;
    fb.textContent='✓ Correct! +10';fb.className='fb-correct';
    const p=getPath(iso);
    if(p){p.classed('correct',true).style('fill',null);}
    updateHUD();
    setTimeout(()=>{
      if(p){p.classed('correct',false).classed('done',true).style('fill','#a8c8a0').style('opacity','0.5');}
      nextQuestion();
    },800);
  } else {
    wrong++;score=Math.max(0,score-3);
    fb.textContent=`✗ That's ${COUNTRY_NAMES[iso]||iso} — try again! −3`;
    fb.className='fb-wrong';
    const p=getPath(iso);
    if(p){
      p.classed('wrong-flash',true).style('fill',null);
      setTimeout(()=>{
        p.classed('wrong-flash',false).style('fill',getCountryColor(iso));
      },650);
    }
    updateHUD();
  }
}

function endGame(){
  current=null;guessing=false;
  document.getElementById('question-box').style.display='none';
  document.getElementById('progress-bar').style.display='none';
  document.getElementById('feedback').textContent='';
  const total=Object.keys(COUNTRY_NAMES).length;
  const pct=Math.round((correct/total)*100);
  document.getElementById('final-text').textContent=
    `${correct} of ${total} correct (${pct}%) — Final score: ${score}`;
  document.getElementById('end-screen').style.display='flex';
}

loadMap().catch(err=>{
  document.getElementById('loading').textContent='Failed to load map. Please reload.';
  console.error(err);
});
</script>
</body>
</html>
